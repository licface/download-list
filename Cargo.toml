[package]
name = "download-list"
version = "1.0.6"
edition = "2021"
description = "List, Get last, extract Last file if possible, with colors and emoji"
authors = ["Hadi Cahyadi <cumulus13@gmail.com>"]
license = "MIT"
homepage = "https://github.com/cumulus13/download-list"
repository = "https://github.com/cumulus13/download-list"
keywords = ["download", "manager", "archive", "extract", "files"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
# Only crates actually used by src/main.rs are listed here. The `.7z` and
# `.rar` formats are handled by shelling out to the `7z` / `unrar` CLI tools
# at runtime (see README), so no Rust crate is needed for them — in
# particular the old `unrar` crate dependency was unused dead weight and,
# since it links against the unrar C++ sources at build time, a real risk of
# build failure on machines without a C++ toolchain. It has been removed.
clap = { version = "4", features = ["derive", "cargo"] }
zip = "0.6"
tar = "0.4"
flate2 = "1"
bzip2 = "0.4"
xz2 = "0.1"
terminal_size = "0.3"
unicode-width = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[[bin]]
name = "dwn"
path = "src/main.rs"
