[package]
name = "download-list"
version = "1.0.0"
edition = "2021"
authors = ["Hadi Cahyadi <cumulus13@gmail.com>"]
license = "MIT"

[[bin]]
name = "dwn"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.4.18", features = ["derive", "color"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
bzip2 = "0.4"
xz2 = "0.1"
terminal_size = "0.3"
unicode-width = "0.1"
