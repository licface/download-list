name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt-clippy:
    name: fmt & clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run formatting
        run: cargo fmt --all
        continue-on-error: true # formatting isn't enforced yet, just reported

      - name: Check formatting
        run: cargo fmt --all -- --check
        continue-on-error: true # formatting isn't enforced yet, just reported

      - name: Clippy Fix
        run: cargo clippy --fix --all-targets --allow-dirty --all-features

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  build:
    name: build (${{ matrix.os }})
    needs: fmt-clippy
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Build
        run: cargo build --release --verbose

      - name: Test
        run: cargo test --release --verbose

      - name: Run --help smoke test
        shell: bash
        run: |
          BIN=target/release/dwn
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          "$BIN" --help

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: dwn-${{ matrix.os }}
          path: |
            target/release/dwn
            target/release/dwn.exe
          if-no-files-found: ignore
          retention-days: 7
